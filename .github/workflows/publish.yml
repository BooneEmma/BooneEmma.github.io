# Render the Quarto site and publish it to the gh-pages branch
# whenever main changes (in practice: when a pull request is merged).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allow a manual run from the Actions tab

permissions:
  contents: write      # needed to push the rendered site to gh-pages

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38   # same version as used locally

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
